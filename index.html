        // ==================================================

        // ==================================================
        // START
        // ==================================================

        function startGame() {

            document.getElementById("home").style.display = "none";

            document.getElementById("caseSelect").style.display = "block";

        }


        // ==================================================
        // SELECT CASE
        // ==================================================

        function selectCase(caseNumber) {

            currentCase = caseNumber;

            currentQuestion = 0;

            legalScore = 0;

            ethicsScore = 0;

            patientScore = 0;

            updateScore();

            document.getElementById("caseSelect").style.display = "none";

            document.getElementById("game").style.display = "block";

            loadQuestion();

        }


        // ==================================================
        // UPDATE SCORE
        // ==================================================

        function updateScore() {

            document.getElementById("legalScore").innerHTML = legalScore;

            document.getElementById("ethicsScore").innerHTML = ethicsScore;

            document.getElementById("patientScore").innerHTML = patientScore;

        }


        // ==================================================
        // LOAD QUESTION
        // ==================================================

        function loadQuestion() {

            const caseData = cases[currentCase];

            const question = caseData.questions[currentQuestion];


            document.getElementById("caseTitle").innerHTML =
                caseData.title;


            document.getElementById("questionNumber").innerHTML =
                "Decision " + (currentQuestion + 1) + " of 3";


            let html =

                "<h2>" +
                question.prompt +
                "</h2>";


            question.choices.forEach(function(choice, index) {

                html +=

                    "<button onclick=\"chooseAnswer(" +
                    index +
                    ", this)\">" +

                    choice.text +

                    "</button>" +

                    "<br><br>";

            });


            document.getElementById("questionArea").innerHTML = html;


            document.getElementById("result").innerHTML = "";

            document.getElementById("nextButton").style.display = "none";

        }


        // ==================================================
        // ANSWER
        // ==================================================

        function chooseAnswer(choiceIndex, buttonClicked) {

            const question =
                cases[currentCase].questions[currentQuestion];

            const choice =
                question.choices[choiceIndex];


            // Disable every answer button

            const buttons =
                document.querySelectorAll("#questionArea button");


            buttons.forEach(function(button) {

                button.disabled = true;

            });


            // Add scores

            legalScore += choice.legal;

            ethicsScore += choice.ethics;

            patientScore += choice.patient;


            updateScore();


            // Show feedback

            document.getElementById("result").innerHTML =

                "<h3>Feedback</h3>" +

                "<p>" +
                choice.feedback +
                "</p>" +

                "<p>⚖️ Legal: +" +
                choice.legal +
                "</p>" +

                "<p>🧠 Ethics: +" +
                choice.ethics +
                "</p>" +

                "<p>❤️ Patient Care: +" +
                choice.patient +
                "</p>";


            // Change NEXT button

            if (currentQuestion < 2) {

                document.getElementById("nextButton").innerHTML =
                    "NEXT";

                document.getElementById("nextButton").onclick =
                    nextQuestion;

            }

            else {

                document.getElementById("nextButton").innerHTML =
                    "SEE RESULTS";

                document.getElementById("nextButton").onclick =
                    showResults;

            }


            document.getElementById("nextButton").style.display =
                "block";

        }


        // ==================================================
        // NEXT QUESTION
        // ==================================================

        function nextQuestion() {

            currentQuestion++;

            loadQuestion();

        }


        // ==================================================
        // RESULTS
        // ==================================================

        function showResults() {

            const caseData = cases[currentCase];


            document.getElementById("questionArea").innerHTML =

                "<h1>CASE COMPLETE</h1>" +

                "<h2>Your Results</h2>" +

                "<p>" +
                caseData.title +
                "</p>" +

                "<h3>⚖️ Legal Judgment</h3>" +

                "<p>" +
                legalScore +
                " / 30</p>" +

                "<h3>🧠 Ethical Reasoning</h3>" +

                "<p>" +
                ethicsScore +
                " / 30</p>" +

                "<h3>❤️ Patient Care</h3>" +

                "<p>" +
                patientScore +
                " / 30</p>";


            document.getElementById("result").innerHTML =

                "<h3>Case Complete</h3>" +

                "<p>You completed all three decisions.</p>";


            document.getElementById("nextButton").innerHTML =
                "BACK TO CASES";


            document.getElementById("nextButton").onclick =
                backToCases;

        }


        // ==================================================
        // BACK TO CASE SELECTION
        // ==================================================

        function backToCases() {

            document.getElementById("game").style.display = "none";

            document.getElementById("caseSelect").style.display = "block";

        }

    </script>

</body>
</html>
